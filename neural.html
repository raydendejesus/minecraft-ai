<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neural Viewer</title>
<style>
  :root {
    --bg:#0a0b24; --panel:#12133a; --panel2:#1a1a4a; --line:#2d2a6e; --text:#e8e4ff; --dim:#a39dd4;
    --violet:#a855f7; --pink:#d946ef; --blue:#3b5bfd; --good:#7ee2b8; --bad:#fca5e4;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:radial-gradient(1100px 600px at 20% -10%, #241a63 0%, var(--bg) 60%); background-color:var(--bg);
         color:var(--text); font:15px/1.45 system-ui, "Segoe UI", sans-serif; min-height:100vh; }
  .wrap { max-width:1240px; margin:0 auto; padding:18px 22px 26px; }
  header { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  h1 { margin:0; font-size:23px; }
  h1 span { color:var(--violet); }
  .dot { width:12px; height:12px; border-radius:50%; background:#3a3a78; flex:none; }
  .dot.on { background:var(--pink); box-shadow:0 0 12px var(--pink); }
  #clock { margin-left:auto; color:var(--dim); font-size:13px; font-variant-numeric:tabular-nums; }
  .card { background:color-mix(in srgb, var(--panel) 90%, transparent); border:1px solid var(--line); border-radius:12px; padding:14px 15px; }
  .card h2 { margin:0 0 8px; font-size:12.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--dim); font-weight:600; }
  .now { margin-bottom:14px; }
  #job { font-size:21px; font-weight:650; overflow-wrap:anywhere; }
  #detail { color:var(--dim); font-size:14px; margin-top:2px; overflow-wrap:anywhere; min-height:20px; }
  .bar { height:9px; background:var(--panel2); border-radius:5px; overflow:hidden; margin-top:10px; }
  .fill { height:100%; width:0; background:linear-gradient(90deg, var(--blue), var(--violet)); transition:width .6s; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(135px, 1fr)); gap:10px; margin-top:12px; }
  .stats div { background:var(--panel2); border-radius:9px; padding:8px 11px; font-size:12.5px; color:var(--dim); }
  .stats b { display:block; color:var(--text); font-size:16px; font-weight:650; font-variant-numeric:tabular-nums; }
  .stats .hot b { color:var(--bad); }
  .grid2 { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px; }
  .req { font-family:Consolas, monospace; font-size:13px; color:var(--dim); overflow-wrap:anywhere; margin-bottom:9px; }
  .typing { font-family:Consolas, monospace; font-size:16px; line-height:1.5; background:#080922; border:1px solid var(--line);
            border-radius:9px; padding:11px 13px; height:260px; overflow-y:auto; white-space:pre-wrap; overflow-wrap:anywhere; }
  .cursor { display:inline-block; width:9px; height:1.05em; vertical-align:-2px; background:var(--pink); animation:blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  @media (prefers-reduced-motion: reduce) { .cursor { animation:none; } }
  #result { font-size:14px; min-height:21px; margin-top:8px; }
  .right { color:var(--good); } .wrong { color:var(--bad); }
  #grid { width:100%; height:308px; display:block; background:#080922; border:1px solid var(--line); border-radius:9px; }
  .note { color:var(--dim); font-size:13px; margin:8px 0 0; }
  .empty { color:var(--dim); padding:30px 8px; text-align:center; font-size:15px; }
  [hidden] { display:none !important; }
  @media (max-width:900px) { .wrap { padding:14px 16px 20px; } .grid2 { grid-template-columns:minmax(0,1fr); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="dot" id="dot"></span>
    <h1>Neural <span>Viewer</span></h1>
    <span id="clock"></span>
  </header>

  <section class="card now" aria-live="polite">
    <h2>Running on your PC now</h2>
    <div id="job">Connecting...</div>
    <div id="detail"></div>
    <div class="bar" id="barWrap" hidden><div class="fill" id="bar"></div></div>
    <div class="stats" id="stats"></div>
  </section>

  <section class="grid2" id="modelArea" hidden>
    <div class="card">
      <h2 id="typeTitle">What it's working on</h2>
      <div class="req" id="req"></div>
      <div class="typing" id="typing"></div>
      <div id="result" role="status"></div>
    </div>
    <div class="card">
      <h2 id="gridTitle">Every neuron</h2>
      <canvas id="grid" role="img" aria-label="All neurons in each layer, brighter when firing"></canvas>
      <p class="note">Each block is one layer's 1,024 neurons. Each dot is one neuron, brighter when firing harder.</p>
    </div>
  </section>

  <section class="card empty" id="noModel" hidden></section>
</div>
<script>
const $ = s => document.querySelector(s);
let shown = 0, typer = null, grids = null;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function drawGrid() {
  const c = $('#grid'), r = c.getBoundingClientRect(), s = window.devicePixelRatio || 1;
  if (!r.width) return;
  c.width = r.width * s; c.height = r.height * s;
  const g = c.getContext('2d'); g.setTransform(s, 0, 0, s, 0, 0);
  const W = r.width, H = r.height;
  if (!grids) return;
  const L = grids.length, cols = 3, rows = Math.ceil(L / cols);
  const gap = 10, bw = (W - gap * (cols + 1)) / cols, bh = (H - gap * (rows + 1) - rows * 15) / rows;
  grids.forEach((grid, l) => {
    const x0 = gap + (l % cols) * (bw + gap), y0 = gap + Math.floor(l / cols) * (bh + gap + 15);
    g.fillStyle = css('--dim'); g.font = '12px system-ui'; g.fillText('Layer ' + (l + 1), x0, y0 + 10);
    const across = Math.ceil(Math.sqrt(grid.length * bw / bh)), down = Math.ceil(grid.length / across);
    const cw = bw / across, ch = bh / down;
    for (let i = 0; i < grid.length; i++) {
      const v = grid.charCodeAt(i) - 48;
      if (!v) continue;
      const t = v / 9;
      g.fillStyle = `rgb(${90 + 160 * t},${60 + 60 * t},${210 + 40 * t})`;
      g.fillRect(x0 + (i % across) * cw, y0 + 15 + Math.floor(i / across) * ch, Math.max(1, cw - .5), Math.max(1, ch - .5));
    }
  });
}

function typeOut(text, frames, done) {
  clearInterval(typer);
  const box = $('#typing'); box.textContent = '';
  const body = document.createTextNode(''), cursor = document.createElement('span');
  cursor.className = 'cursor'; box.append(body, cursor);
  let i = 0, f = 0;
  const step = Math.max(1, Math.ceil(text.length / 90));   // long answers type faster so it keeps up
  const pause = Math.max(25, Math.min(90, 2400 / Math.max(1, text.length / step)));   // short ones slow down to watch
  typer = setInterval(() => {
    body.appendData(text.slice(i, i + step)); i += step;
    box.scrollTop = box.scrollHeight;
    while (f + 1 < frames.length && frames[f + 1].at <= i) f++;   // neurons from this point in the answer
    if (grids !== frames[f].grids) {
      grids = frames[f].grids; drawGrid();
      const avg = frames[f].firing.reduce((a, b) => a + b, 0) / frames[f].firing.length;
      const el = $('#firingNow'); if (el) el.textContent = Math.round(avg * 100) + '%';
    }
    if (i >= text.length) { clearInterval(typer); cursor.remove(); done(); }
  }, pause);
}

function stat(k, v, hot) {
  const d = document.createElement('div'); if (hot) d.className = 'hot';
  const b = document.createElement('b'); b.textContent = v; d.append(k, b); return d;
}

function show(s) {
  $('#clock').textContent = s.clock;
  const m = s.model, live = !!(m && m.live && !m.done);
  $('#dot').classList.toggle('on', !!s.job);
  const name = live ? m.job.replace('merged training', 'Builder training') : s.job;
  $('#job').textContent = name || 'Nothing running right now';
  const also = live && s.job && s.job.startsWith('Redstone') ? `   Also running: ${s.job} (${s.detail})` : '';
  $('#detail').textContent = live ? `Step ${m.step.toLocaleString()} of ${m.total.toLocaleString()}${also}` : s.detail;

  const stats = $('#stats'); stats.textContent = '';
  if (live) {
    stats.append(stat('Loss (lower is better)', m.loss.toFixed(4)));
    const firing = stat('Neurons firing', '-');
    firing.querySelector('b').id = 'firingNow';
    stats.append(firing);
    stats.append(stat('Model size', (m.params / 1e6).toFixed(2) + 'M parameters'));
  }
  if (s.gpu) {
    stats.append(stat('GPU temperature', s.gpu.temp.toFixed(0) + '°C', s.gpu.temp >= 82));
    stats.append(stat('GPU load', s.gpu.load.toFixed(0) + '%, ' + s.gpu.power.toFixed(0) + ' W'));
  }
  $('#barWrap').hidden = !live;
  if (live) $('#bar').style.width = (m.step / m.total * 100) + '%';

  $('#modelArea').hidden = !m;
  $('#noModel').hidden = !!m;
  if (!m) {
    $('#noModel').textContent = s.job
      ? 'No model is training in this job, so there are no neurons to show. They appear when a model starts training.'
      : 'Nothing is running. Neurons appear when a model starts training.';
    return;
  }
  $('#typeTitle').textContent = live ? 'What it\'s working on right now' : 'The last thing it worked on (not training now)';
  $('#gridTitle').textContent = live ? 'Every neuron, right now' : 'Every neuron, when last seen';
  if (m.time !== shown) {
    shown = m.time;
    $('#req').textContent = m.request.replace(/\n/g, ' ');
    $('#result').textContent = '';
    typeOut(m.typed, m.frames, () => {
      const r = $('#result');
      r.className = m.right ? 'right' : 'wrong';
      r.textContent = m.right ? 'Correct' : 'Not right. Correct answer: ' + m.answer.replace(/\n/g, ' ').slice(0, 160);
    });
  }
}

async function tick() {
  try { show(await (await fetch('/api/live')).json()); } catch { $('#job').textContent = 'Lost connection to the viewer'; }
}
setInterval(tick, 3000); tick();
addEventListener('resize', drawGrid);
</script>
</body>
</html>
